[workspace]
resolver = "2"
members = [
  "core/aetheria-engine",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
