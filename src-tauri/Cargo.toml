[package]
name = "aetheria-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Desktop Shell for Aetheria with Tauri v2"

[lib]
name = "aetheria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aetheria-engine = { path = "../core/aetheria-engine" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.15"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
